<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>本地播放器 · 黄果短剧下载器</title>
<link rel="stylesheet" href="/static/common.css?v=20261029">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { background: #0f1115; color: #e8eaed; font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
         height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

  .header { flex: 0 0 auto; display: flex; align-items: center; gap: 12px; padding: 12px 20px;
            background: #161922; border-bottom: 1px solid #262b38; }
  .logo { font-size: 17px; font-weight: 700; color: #ffb84d; white-space: nowrap; }
  .back { margin-left: auto; padding: 6px 14px; border: 1px solid #2c3345; border-radius: 8px;
          background: #1d2230; color: #cfd6e4; font-size: 13px; text-decoration: none; }
  .back:hover { border-color: #ffb84d; color: #ffb84d; }

  .layout { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 320px; }

  /* 播放区 */
  .stage { display: flex; flex-direction: column; min-width: 0; background: #0b0d12; }
  .video-box { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden;
               display: flex; align-items: center; justify-content: center; background: #000; }
  .video-box video { position: absolute; inset: 0; width: 100%; height: 100%;
                     object-fit: contain; background: #000; outline: none; }
  .stage-bar { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 10px 16px;
               background: #12151d; border-top: 1px solid #232936; }
  .now { flex: 0 1 auto; font-size: 14px; font-weight: 600; min-width: 0;
         white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .now-sub { flex: 0 0 auto; margin-left: auto; font-size: 12px; color: #9aa3b5; white-space: nowrap; }
  .placeholder { color: #4a5265; font-size: 14px; text-align: center; line-height: 1.9; padding: 20px; }

  /* 标题行右侧的「剧集」按钮（移动端使用） */
  .eps-btn { display: none; flex: 0 0 auto; padding: 5px 12px; border: 1px solid #2c3345; border-radius: 8px;
             background: #1d2230; color: #ffb84d; font-size: 12px; font-family: inherit; cursor: pointer; }
  .eps-btn:disabled { opacity: .4; }

  /* 剧集弹框（底部面板） */
  .eps-mask { position: fixed; inset: 0; z-index: 120; display: none; align-items: flex-end;
              background: rgba(0, 0, 0, .6); }
  .eps-mask.show { display: flex; }
  .eps-panel { width: 100%; max-height: 70vh; display: flex; flex-direction: column;
               background: #161922; border-top-left-radius: 14px; border-top-right-radius: 14px;
               padding: 14px 16px calc(16px + env(safe-area-inset-bottom)); }
  .eps-panel h4 { flex: 0 0 auto; font-size: 14px; color: #ffb84d; margin-bottom: 12px; }
  .eps-panel h4 span { margin-left: 8px; font-size: 12px; font-weight: 400; color: #6b7385; }
  .eps-grid { flex: 1 1 auto; overflow-y: auto; display: flex; flex-wrap: wrap; gap: 8px; }
  .eps-item { padding: 7px 14px; border: 1px solid #2c3345; border-radius: 8px; background: #232938;
              color: #c7d2e5; font-size: 13px; font-family: inherit; cursor: pointer; }
  .eps-item.cur { background: #ffb84d; border-color: #ffb84d; color: #1a1207; font-weight: 600; }

  /* 滑动快进时的浮层提示 */
  .seek-hint { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
               min-width: 132px; padding: 10px 16px; border-radius: 10px; text-align: center;
               background: rgba(0, 0, 0, .72); color: #ffb84d; font-size: 16px; font-weight: 700;
               pointer-events: none; opacity: 0; transition: opacity .15s; z-index: 3; }
  .seek-hint.show { opacity: 1; }
  .seek-hint .sh-time { display: block; margin-top: 4px; font-size: 12px;
                        font-weight: 400; color: #cfd6e4; font-variant-numeric: tabular-nums; }

  /* 剧集列表 */
  .playlist { display: flex; flex-direction: column; min-height: 0;
              background: #141822; border-left: 1px solid #232936; }
  .pl-head { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 12px 14px;
             border-bottom: 1px solid #232936; }
  .pl-head h3 { font-size: 14px; color: #ffb84d; }
  .pl-head .count { margin-left: auto; font-size: 12px; color: #6b7385; }
  .pl-list { flex: 1 1 auto; overflow-y: auto; padding: 8px 8px 110px; }
  .drama { border: 1px solid #232936; border-radius: 10px; margin-bottom: 8px; background: #1a1f2b; overflow: hidden; }
  .drama.open { border-color: #3a4260; }
  .drama-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; cursor: pointer; }
  .drama-title { flex: 1; min-width: 0; font-size: 13px; font-weight: 600;
                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .drama-meta { flex-shrink: 0; font-size: 11px; color: #6b7385; }
  .drama-eps { display: none; flex-wrap: wrap; gap: 6px; padding: 0 12px 10px; }
  .drama.open .drama-eps { display: flex; }
  .ep { padding: 4px 9px; border: 1px solid #2c3345; border-radius: 6px; background: #232938;
        color: #c7d2e5; font-size: 12px; font-family: inherit; cursor: pointer; }
  .ep:hover { border-color: #ffb84d; color: #ffb84d; }
  .ep.playing { background: #ffb84d; border-color: #ffb84d; color: #1a1207; font-weight: 600; }
  .empty { padding: 40px 18px; text-align: center; color: #6b7385; font-size: 13px; line-height: 1.9; }

  /* ---------- 移动端：沉浸式播放（视频占满，剧集列表隐藏，标题行放「剧集」按钮） ---------- */
  @media (max-width: 860px) {
    .header { padding: 10px 14px; gap: 10px; }
    .logo { font-size: 15px; }
    .back { padding: 5px 11px; font-size: 12px; }
    .layout { display: flex; flex-direction: column; }
    .stage { order: 1; flex: 1 1 auto; min-height: 0; }
    .video-box { flex: 1 1 auto; height: auto; min-height: 0; }
    .stage-bar { padding: 8px 12px calc(9px + env(safe-area-inset-bottom)); }
    .now { font-size: 13px; }
    .now-sub { font-size: 11px; }
    .eps-btn { display: block; }
    .playlist { display: none; }
    /* 移动端播放页隐藏悬浮按钮，避免遮挡画面/原生控件 */
    body .fab-group { display: none; }
  }
</style>
</head>
<body>
  <div class="header">
    <div class="logo">本地播放器</div>
    <a class="back" href="/">返回首页</a>
  </div>

  <div class="layout">
    <div class="stage">
      <div class="video-box" id="videoBox">
        <div class="placeholder" id="placeholder">选择右侧剧集开始播放<br>（仅支持已下载到本地的视频）</div>
        <video id="video" controls playsinline webkit-playsinline x5-playsinline preload="metadata" style="display:none"></video>
        <div class="seek-hint" id="seekHint"><span id="seekHintText"></span><span class="sh-time" id="seekHintTime"></span></div>
      </div>
      <div class="stage-bar">
        <div class="now" id="nowTitle">未选择剧集</div>
        <div class="now-sub" id="nowSub"></div>
        <button class="eps-btn" id="btnEps" disabled>剧集</button>
      </div>
    </div>

    <div class="playlist">
      <div class="pl-head">
        <h3>已下载剧集</h3>
        <span class="count" id="plCount"></span>
      </div>
      <div class="pl-list" id="plList"><div class="empty">加载中...</div></div>
    </div>
  </div>

  <!-- 移动端剧集弹框：列出当前这部剧已下载的全部集数 -->
  <div class="eps-mask" id="epsMask">
    <div class="eps-panel">
      <h4>剧集<span id="epsPanelSub"></span></h4>
      <div class="eps-grid" id="epsGrid"></div>
    </div>
  </div>

<script src="/static/common.js?v=20261029"></script>
<script>
const video = document.getElementById("video");
const videoBox = document.getElementById("videoBox");
const placeholder = document.getElementById("placeholder");
const nowTitle = document.getElementById("nowTitle");
const nowSub = document.getElementById("nowSub");
const listEl = document.getElementById("plList");
const countEl = document.getElementById("plCount");
const btnEps = document.getElementById("btnEps");
const epsMask = document.getElementById("epsMask");
const epsGrid = document.getElementById("epsGrid");
const epsPanelSub = document.getElementById("epsPanelSub");
const seekHint = document.getElementById("seekHint");
const seekHintText = document.getElementById("seekHintText");
const seekHintTime = document.getElementById("seekHintTime");

const isNarrow = () => window.matchMedia("(max-width: 860px)").matches;
let items = [];
let cur = null;        // {folder, ep, eps}
let swipe = null;      // 视频上左右滑动的状态 {x, y, t, dur, active, dx, target}

const esc = s => String(s).replace(/[&<>"']/g,
  c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const streamUrl = (folder, ep) =>
  "/api/library/stream?folder=" + encodeURIComponent(folder) + "&ep=" + ep;
const sortedEps = () => [...cur.eps].sort((a, b) => a - b);

function fmtTime(s) {
  if (!isFinite(s) || s < 0) s = 0;
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = Math.floor(s % 60);
  const mm = String(m).padStart(2, "0"), ss = String(sec).padStart(2, "0");
  return h ? h + ":" + mm + ":" + ss : mm + ":" + ss;
}

async function load() {
  try {
    const d = await (await fetch("/api/library")).json();
    items = d.items || [];
    render();
    resumeFromUrl();
  } catch (e) {
    listEl.innerHTML = '<div class="empty">加载失败：' + esc(e.message) + '</div>';
  }
}

// 支持 /player?folder=剧名&ep=2 直接播放（剧集页点已下载的集数会这样跳过来）
function resumeFromUrl() {
  const q = new URLSearchParams(location.search);
  const folder = q.get("folder");
  if (!folder) return;
  const it = items.find(x => x.folder === folder);
  if (!it || !it.episodes.length) return;
  const eps = it.episodes.map(e => e.ep).sort((a, b) => a - b);
  const ep = Number(q.get("ep")) || eps[0];
  play(folder, eps.includes(ep) ? ep : eps[0], eps);
}

function render() {
  const total = items.reduce((s, it) => s + it.size, 0);
  countEl.textContent = items.length ? items.length + " 部 · " + HgCommon.fmtSize(total) : "";
  if (!items.length) {
    listEl.innerHTML = '<div class="empty">还没有已下载的剧集<br>先去首页下载吧</div>';
    return;
  }
  listEl.innerHTML = items.map((it, i) => {
    const eps = it.episodes.map(e => e.ep).sort((a, b) => a - b);
    return '<div class="drama" data-i="' + i + '">' +
      '<div class="drama-head"><div class="drama-title">' + esc(it.folder) + '</div>' +
      '<div class="drama-meta">' + eps.length + ' 集</div></div>' +
      '<div class="drama-eps">' +
        eps.map(ep => '<button class="ep" data-ep="' + ep + '">第' + ep + '集</button>').join("") +
      '</div>' +
    '</div>';
  }).join("");
}

function play(folder, ep, eps) {
  cur = { folder, ep, eps };
  placeholder.style.display = "none";
  video.style.display = "block";
  video.src = streamUrl(folder, ep);
  video.play().catch(() => {});  // 由点击触发，正常不会被浏览器拦截
  nowTitle.textContent = folder;
  nowSub.textContent = "第" + ep + "集";
  btnEps.disabled = false;
  hideSeekHint();
  closeEpsPanel();
  swipe = null;
  document.querySelectorAll(".ep.playing").forEach(el => el.classList.remove("playing"));
  const drama = [...listEl.querySelectorAll(".drama")]
    .find(d => items[+d.dataset.i].folder === folder);
  if (drama) {
    drama.classList.add("open");
    const btn = drama.querySelector('.ep[data-ep="' + ep + '"]');
    if (btn) btn.classList.add("playing");
  }
}

// 切换上一集/下一集（+1 下一集，-1 上一集；一集播完自动顺延时使用）
function stepEp(step) {
  if (!cur) return;
  const eps = sortedEps();
  const i = eps.indexOf(cur.ep);
  const j = i + step;
  if (i < 0 || j < 0 || j >= eps.length) return;
  play(cur.folder, eps[j], cur.eps);
}

// ---------- 「剧集」弹框：列出当前这部剧已下载的全部集数 ----------
function openEpsPanel() {
  if (!cur) return;
  const eps = sortedEps();
  epsPanelSub.textContent = cur.folder + " · 共 " + eps.length + " 集";
  epsGrid.innerHTML = eps.map(ep =>
    '<button class="eps-item' + (ep === cur.ep ? " cur" : "") + '" data-ep="' + ep + '">第' + ep + '集</button>'
  ).join("");
  epsMask.classList.add("show");
  const curEl = epsGrid.querySelector(".eps-item.cur");
  if (curEl) curEl.scrollIntoView({ block: "center" });
}
function closeEpsPanel() { epsMask.classList.remove("show"); }

btnEps.addEventListener("click", openEpsPanel);
epsMask.addEventListener("click", e => {
  const item = e.target.closest(".eps-item");
  if (item) { play(cur.folder, Number(item.dataset.ep), cur.eps); return; }
  if (e.target === epsMask) closeEpsPanel();
});

// ---------- 在视频画面上左右滑动快进/快退（移动端） ----------
const SWIPE_MIN = 14;  // 水平位移超过 14px 才认作滑动快进，避免误伤单击/原生控件

function showSeekHint(delta, target) {
  const s = Math.abs(Math.round(delta));
  seekHintText.textContent = (delta >= 0 ? "快进 " : "快退 ") + s + " 秒";
  seekHintTime.textContent = fmtTime(target) + " / " + fmtTime(video.duration || 0);
  seekHint.classList.add("show");
}
function hideSeekHint() { seekHint.classList.remove("show"); }

function seekTo(t) {
  if (!video.duration) return;
  video.currentTime = Math.min(Math.max(0, t), Math.max(0, video.duration - 0.3));
}

videoBox.addEventListener("touchstart", e => {
  if (!cur || e.touches.length !== 1 || !video.duration) return;
  const t = e.touches[0];
  swipe = { x: t.clientX, y: t.clientY, t0: video.currentTime, dur: video.duration,
            active: false, target: video.currentTime };
}, { passive: true });

videoBox.addEventListener("touchmove", e => {
  if (!swipe || e.touches.length !== 1) return;
  const t = e.touches[0];
  const dx = t.clientX - swipe.x, dy = t.clientY - swipe.y;
  if (!swipe.active) {
    if (Math.abs(dx) < SWIPE_MIN || Math.abs(dx) < Math.abs(dy) * 1.2) return;
    swipe.active = true;
  }
  e.preventDefault();  // 占住手势，避免触发页面滚动或拖动原生进度条
  const w = videoBox.clientWidth || 1;
  const delta = dx / w * swipe.dur;  // 划过整个宽度 ≈ 对应整集时长
  swipe.target = Math.min(swipe.dur, Math.max(0, swipe.t0 + delta));
  showSeekHint(swipe.target - swipe.t0, swipe.target);
}, { passive: false });

function endSwipe(apply) {
  if (!swipe) return;
  const s = swipe;
  swipe = null;
  hideSeekHint();
  if (s.active && apply) seekTo(s.target);
}
videoBox.addEventListener("touchend", () => endSwipe(true));
videoBox.addEventListener("touchcancel", () => endSwipe(false));

listEl.addEventListener("click", e => {
  const drama = e.target.closest(".drama");
  if (!drama) return;
  const it = items[+drama.dataset.i];
  const epBtn = e.target.closest(".ep");
  if (epBtn) {
    play(it.folder, Number(epBtn.dataset.ep), it.episodes.map(x => x.ep));
    return;
  }
  drama.classList.toggle("open");
});

// 一集播完自动播下一集（仅限已下载的集）
video.addEventListener("ended", () => stepEp(1));

// 首次播放前可能要转封装成 MP4，给个状态提示
video.addEventListener("waiting", () => { if (cur) nowSub.textContent = "第" + cur.ep + "集 · 缓冲中..."; });
video.addEventListener("playing", () => { if (cur) nowSub.textContent = "第" + cur.ep + "集"; });
video.addEventListener("error", () => {
  if (cur) nowSub.textContent = "第" + cur.ep + "集 · 播放失败";
});

// 移动端隐藏了剧集列表，提示从「我的剧集」进入
if (isNarrow()) {
  placeholder.innerHTML = "请从「我的剧集」点击已下载的集数进入播放";
}

load();
</script>
</body>
</html>
